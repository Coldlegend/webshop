#--------------------------H2--------------------------------------------#
# Beépített H2 memóriabeli adatbázis (nem kell telepíteni semmit)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Biztosítja, hogy a Hibernate létrehozza a táblát, és CSAK UTÁNA fusson le a data.sql
spring.jpa.defer-datasource-initialization=true

# Biztosítja, hogy a data.sql mindig lefusson beágyazott/memóriabeli adatbázisoknál
spring.sql.init.mode=always

# Böngész?s felület engedélyezése, hogy lásd a táblákat
spring.h2.console.enabled=true


#---------------------------------------------------------------------------#
# JPA / Hibernate beállítások
# Az 'update' automatikusan létrehozza vagy módosítja a táblákat a Java entitások alapján
spring.jpa.hibernate.ddl-auto=update

# Kiírja a konzolra a végrehajtott SQL parancsokat (fejlesztéshez nagyon hasznos)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true